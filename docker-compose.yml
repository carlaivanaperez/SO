services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ferrestock
      POSTGRES_PASSWORD: ferrestock
      POSTGRES_DB: ferrestock
    ports:
      - "5432:5432"
    volumes:
      - ferrestock_pgdata:/var/lib/postgresql/data

volumes:
  ferrestock_pgdata:
